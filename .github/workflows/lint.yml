name: lint
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint_python:
    timeout-minutes: 3
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev
      
      - name: Lint with flake8
        run: uv run flake8 src/

      - name: Lint with pylint
        run: PYTHONPATH=. uv run pylint src/ --fail-under=8
  
  lint_docker:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    needs: lint_python

    steps:
      - uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile
