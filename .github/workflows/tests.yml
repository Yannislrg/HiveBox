name: tests
on:
  workflow_run:
    workflows: ["build"]
    types:
      - completed

jobs:
  run_tests:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install --only-binary :all: -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -q

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image built by workflow `build`
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/hivebox:${{ github.event.workflow_run.head_sha }}
          docker pull "$IMAGE"

      - name: Call and check version end point
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/hivebox:${{ github.event.workflow_run.head_sha }}
          docker run -d -p 8080:8000 "$IMAGE"
          sleep 5
          RESPONSE=$(curl -s http://localhost:8080/version)
          if [[ "$RESPONSE" != "{\"version\":\"v0.0.2\"}" ]]; then
            echo "Version endpoint did not return expected response: $RESPONSE"
            exit 1
          fi
