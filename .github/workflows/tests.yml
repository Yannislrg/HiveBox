name: tests
on:
  workflow_run:
    workflows: ["build"]
    types:
      - completed

jobs:
  run_tests:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          uv run pytest tests/ -q

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image built by workflow `build`
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          IMAGE="ghcr.io/${OWNER}/hivebox:sha-${SHORT_SHA}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker pull "$IMAGE"

      - name: Call and check version end point
        run: |
          docker run -d -p 8080:8000 "$IMAGE"
          sleep 5
          RESPONSE=$(curl -s http://localhost:8080/version)
          if [[ "$RESPONSE" != "{\"version\":\"v0.0.2\"}" ]]; then
            echo "Version endpoint did not return expected response: $RESPONSE"
            exit 1
          fi
