name: integration-tests
on:
  workflow_run:
    workflows: ["build"]
    types:
      - completed

jobs:
  run_integration_tests:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image built by workflow `build`
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          IMAGE="ghcr.io/${OWNER}/hivebox:sha-${SHORT_SHA}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker pull "$IMAGE"

      - name: Run integration tests
        run: |
          docker run -d -p 8000:8000 \
            --name hivebox-integration-test \
            "$IMAGE"
          
          echo "Waiting for application to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/version > /dev/null 2>&1; then
              echo "Application is ready!"
              break
            fi
            sleep 2
          done

          curl -LsSf https://astral.sh/uv/install.sh | sh
          source $HOME/.cargo/env

          uv sync

          uv run pytest tests/integration/ -v

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f hivebox-integration-test 2>/dev/null || true
