apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

helmCharts:
  - name: minio
    releaseName: minio-infra
    namespace: minio
    version: 12.8.0
    repo: https://charts.bitnami.com/bitnami
    valuesInline:
      auth:
        rootUser: minioadmin
        rootPassword: minioadmin
      defaultBuckets: hivebox-data
      persistence:
        enabled: false
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 200m
