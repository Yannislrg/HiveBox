apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmGlobals:
  chartHome: charts/minio-12.8.0

helmCharts:
  - name: minio
    releaseName: minio-infra
    namespace: minio
    version: 12.8.0
    valuesInline:
      auth:
        rootUser: minioadmin
        rootPassword: minioadmin
      persistence:
        enabled: false
      defaultBuckets: hivebox-data
