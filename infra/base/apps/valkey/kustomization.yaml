apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: redis
    releaseName: valkey-infra
    namespace: valkey
    version: 18.2.0
    repo: https://charts.bitnami.com/bitnami
    valuesInline:
      auth:
        enabled: false
      master:
        persistence:
          enabled: false
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 200m
      replica:
        replicaCount: 0
