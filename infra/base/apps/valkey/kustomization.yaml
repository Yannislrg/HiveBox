apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: redis
    repo: https://charts.bitnami.com/bitnami
    releaseName: valkey-infra
    namespace: valkey
    version: 18.2.0
    valuesInline:
      auth:
        enabled: false
      architecture: standalone
      master:
        persistence:
          enabled: false
