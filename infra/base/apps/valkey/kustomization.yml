apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: valkey

helmCharts:
  - name: redis
    repo: https://charts.bitnami.com/bitnami
    version: 18.2.0
    releaseName: valkey-infra
    valuesInline:
      mode: "standalone"
      architecture: "standalone"
      auth:
        enabled: false
